[project]
name = "ingest-parse"
version = "0.1.0"
description = "txt/doc/docx/docm/rtf/pdf (born-digital) → Markdown + media (Docling), optional VLM image descriptions."
readme = "README.md"
authors = [
    { name = "Boris Serzh", email = "borisserzh5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling-slim[convert-core,format-docx,format-pdf,models-local]==2.131.0",
    "opencv-python-headless>=4.6,<5",
    "pillow>=10",
    "pylatexenc>=2.10,<3.0",
    "pypdfium2>=4.30",
]

[project.scripts]
ingest-parse = "ingest_parse.__main__:main"

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.17",
    "rapidocr>=3.4,<4",
]

[tool.uv]
# rapidocr тянет полный opencv-python; cv2 уже даёт opencv-python-headless — два пакета перетирают друг друга
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

