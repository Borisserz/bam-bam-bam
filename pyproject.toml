[project]
name = "ingest-parse"
version = "0.1.0"
description = "txt/doc/docx/docm/rtf → Markdown + media (Docling), optional VLM image descriptions."
readme = "README.md"
authors = [
    { name = "Boris Serzh", email = "borisserzh5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling-slim[format-docx,convert-core]==2.131.0",
    "pillow>=10",
    "pylatexenc>=2.10,<3.0",
    "pypdfium2>=4.30",
]

[project.scripts]
ingest-parse = "ingest_parse.__main__:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

